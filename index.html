<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jedzeniomat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/variables.css" />
  </head>
  <body>
    <header class="app-header">
      <div
        style="
          position: absolute;
          top: 20px;
          right: 20px;
          display: flex;
          gap: 10px;
        "
      >
        <a href="cart.html" class="cart-icon-btn">
          🛒
          <span id="header-cart-badge" class="cart-badge" style="display: none"
            >0</span
          >
        </a>

        <button id="theme-toggle" class="theme-toggle-btn">🌙 Ciemny</button>
      </div>

      <div class="header-content">
        <div class="logo">🍕 Jedzeniomat</div>
        <p class="subtitle">Odkryj najlepsze smaki w Twojej okolicy</p>
      </div>
    </header>

    <main>
      <dialog class="restaurant-modal" id="restaurant-popup">
        <div class="restaurant-details" id="restaurant-details-modal"></div>
      </dialog>

      <div class="search-section">
        <div class="filter-container" id="filter-options">
          <input
            type="text"
            placeholder="Szukaj restauracji..."
            class="search-bar"
            id="restaurant-search"
          />

          <div id="custom-category-select" class="custom-select-wrapper"></div>
        </div>
      </div>

      <div class="restaurant-grid" id="restaurant-list"></div>
    </main>

    <script type="module" src="src/js/app.js"></script>
    <script type="module" src="src/js/api.js"></script>
    <script type="module" src="src/js/restaurantCards.js"></script>
    <script type="module" src="src/js/restaurantSearch.js"></script>
    <script type="module" src="src/js/ui.js"></script>
    <script type="module" src="src/js/store.js"></script>
  </body>
</html>
